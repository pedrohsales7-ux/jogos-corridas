<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overllord</title>


    <style>
        body{

           margin: 0%;
           font-family: Arial, sans-serif;
            background-color: #121212 ;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login{

            background-color: #1e1e1e;
            width: 350px;
            padding: 100px;
            border-radius: 15px;
            box-shadow: 0 0 15px #00ff99;
            text-align: center;
        }

        h1{

            color: #00ff99;} 
            
        p{
             color: white;}

        input{

            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button{

            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: #00ff99;
            font-weight: bold;
            cursor:pointer;
            font-size: 20px;
        }   
        button:hover{

            background: #00cc77;
        }

        a{

            text-decoration: none;
            color: #00ff99;
            
        }

            

        
    </style>
</head>
<body>

    <div class="login">

        <h1> 👾 Overllord </h1>

        <p> Entre na sua conta </p>

        <form action="home.html"> 

            <input type="email" placeholder="Digite seu e-mail">

            <input type="password" placeholder="Digite sua senha">

            <button type="submit"> Entrar </button>

            </form>

            <p>
                <a href="#"> Criar Contas</a>
            </p>
        
        
    
    </div>
    
</body>
</html>
